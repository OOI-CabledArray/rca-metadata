# Keeps the pinned actions and the dashboard's dependencies from ageing
# silently. The one third-party action is pinned to a commit, which is safe
# until it is stale; this is what says so.
#
# Monthly rather than weekly: nothing here moves fast, and a pull request
# nobody reads is worse than no pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: actions

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: dashboard
    groups:
      # One pull request for the framework rather than six. Nuxt, its UI kit and
      # the build tooling move together, and typecheck plus the dashboard tests
      # gate the merge either way.
      nuxt:
        patterns: ["nuxt", "@nuxt/*", "@pinia/*", "pinia", "vue", "vue-router", "@tailwindcss/*", "tailwindcss"]
    ignore:
      # TypeScript 7 is the native port and drops lib/tsc, which vue-tsc loads,
      # so `npm run typecheck` fails outright. Lift once vue-tsc supports it.
      - dependency-name: "typescript"
        versions: [">=7"]
      # Types track the Node that builds the site (NODE_VERSION in pages.yaml).
      # Newer types would accept calls that runtime does not have. Raise this
      # bound together with NODE_VERSION.
      - dependency-name: "@types/node"
        versions: [">=25"]
